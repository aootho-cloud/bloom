/* ---------- Tokens ---------- */
:root {
  --bg: #fff6f8;
  --surface: #ffffff;
  --surface-2: #ffeef3;
  --border: #f6d3de;
  --text: #3a1a24;
  --muted: #7a4f5c;
  --primary: #c2185b;
  --primary-strong: #9c1048;
  --primary-soft: #fbd3df;
  --period: #c62848;
  --period-text: #ffffff;
  --predicted-bg: #fde4ea;
  --predicted-line: #d9456a;
  --fertile-bg: #ffe9dc;
  --fertile-line: #c8642e;
  --ovulation: #b4511d;
  --focus: #6a1b9a;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 6px 20px rgba(194, 24, 91, 0.08);
  --nav-h: 68px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
}
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5rem; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.1rem; }
p { margin: 0 0 .75rem; }
a { color: var(--primary-strong); }
img, svg { display: block; }
button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.app-main:focus { outline: none; }

.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: 12px; top: -60px; z-index: 50;
  background: var(--primary); color: #fff; padding: 8px 14px; border-radius: 10px;
}
.skip-link:focus { top: 12px; }

/* ---------- Layout ---------- */
.app-header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255, 246, 248, .92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
.brand {
  display: inline-flex; align-items: center; gap: 8px;
  text-decoration: none; color: var(--primary-strong);
  font-weight: 700; font-size: 1.2rem; letter-spacing: .3px;
}
.app-main {
  max-width: 560px; margin: 0 auto;
  padding: 20px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);
}

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  display: flex; justify-content: space-around;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 6px 4px calc(env(safe-area-inset-bottom) + 6px);
  min-height: var(--nav-h);
}
.bottom-nav a {
  flex: 1; max-width: 110px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  text-decoration: none; color: var(--muted); font-size: .75rem; font-weight: 600;
  border-radius: 12px; padding: 4px 0;
}
.bottom-nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bottom-nav a[aria-current="page"] { color: var(--primary); background: var(--surface-2); }

/* ---------- Components ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.grid-2 .card { margin-bottom: 0; }
.stat-label { font-size: .8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; margin: 0 0 4px; }
.stat-value { font-size: 1.1rem; font-weight: 700; margin: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 10px 18px;
  border-radius: 999px; border: 2px solid transparent;
  font-weight: 700; cursor: pointer; text-decoration: none;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-strong); }
.btn-secondary { background: var(--surface); color: var(--primary-strong); border-color: var(--primary); }
.btn-secondary:hover { background: var(--surface-2); }
.btn-danger { background: var(--surface); color: #a3122f; border-color: #a3122f; }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1px solid var(--border); color: var(--primary-strong);
  cursor: pointer; text-decoration: none; font-size: 1.2rem; font-weight: 700;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn[aria-disabled="true"] { opacity: .4; pointer-events: none; }

.chip {
  display: inline-block; padding: 4px 12px; border-radius: 999px;
  background: var(--surface-2); color: var(--primary-strong);
  font-size: .85rem; font-weight: 700;
}

.muted { color: var(--muted); }
.small { font-size: .875rem; }
.center { text-align: center; }

/* ---------- Today ---------- */

.ring { position: relative; width: 220px; height: 220px; margin: 8px 0 16px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--primary-soft); stroke-width: 14; }
.ring .progress { fill: none; stroke: var(--primary); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.ring-center {

.ring-sub { font-size: .95rem; font-weight: 600; max-width: 140px; }

.pills { display: flex; flex-wrap: wrap; gap: 8px; }

.pill span {
  display: inline-flex; align-items: center; min-height: 40px; padding: 8px 14px;

}
.pill input:checked + span { background: var(--primary); border-color: var(--primary); color: #fff; }
.pill input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.pill span:hover { border-color: var(--primary); }

.date-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.date-nav h1 { margin: 0; text-align: center; flex: 1; font-size: 1.25rem; }

/* ---------- Calendar ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-head h1 { margin: 0; font-size: 1.25rem; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-dow { text-align: center; font-size: .75rem; font-weight: 700; color: var(--muted); padding-bottom: 4px; }
.cal-day {
  position: relative; aspect-ratio: 1; min-height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; text-decoration: none; color: var(--text); font-weight: 600;
  border: 2px solid transparent;
}
a.cal-day:hover { background: var(--surface-2); }
.cal-day.future { color: var(--muted); }
.cal-day.fertile { background: var(--fertile-bg); }
.cal-day.ovulation { border-color: var(--fertile-line); }
.cal-day.predicted { background: var(--predicted-bg); border: 2px dashed var(--predicted-line); }
.cal-day.spotting { background: var(--predicted-bg); }
.cal-day.period { background: var(--period); color: var(--period-text); }
.cal-day.today { box-shadow: 0 0 0 3px var(--text) inset; }
.cal-day.period.today { box-shadow: 0 0 0 3px #fff inset, 0 0 0 2px var(--period); }
.cal-day.has-log::after {
  content: ""; position: absolute; bottom: 5px; width: 5px; height: 5px; border-radius: 50%;
  background: var(--primary-strong);
}
.cal-day.period.has-log::after { background: #fff; }

.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 16px; padding: 0; list-style: none; font-size: .85rem; }
.legend li { display: flex; align-items: center; gap: 6px; }
.swatch { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; }
.swatch.period { background: var(--period); }
.swatch.predicted { background: var(--predicted-bg); border: 2px dashed var(--predicted-line); }
.swatch.fertile { background: var(--fertile-bg); }
.swatch.ovulation { background: var(--fertile-bg); border-color: var(--fertile-line); }
.swatch.today { box-shadow: 0 0 0 2px var(--text) inset; }

/* ---------- History ---------- */
.period-list { list-style: none; margin: 0; padding: 0; }
.period-list li {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.period-list li:last-child { border-bottom: 0; }
.period-dates { font-weight: 700; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 70px 1fr 40px; align-items: center; gap: 8px; font-size: .85rem; }
.bar-track { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--primary); border-radius: 999px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; transform: translate(-50%, 20px);
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  background: var(--text); color: #fff; padding: 10px 18px; border-radius: 999px;
  font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  z-index: 20; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

<script>
'use strict';
(() => {
/* ===== utils ===== */
// Date helpers. Dates are stored as local "YYYY-MM-DD" keys.

const pad = (n) => String(n).padStart(2, '0');

const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

function fromKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

const isValidKey = (key) => /^\d{4}-\d{2}-\d{2}$/.test(key) && !isNaN(fromKey(key));

function today() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

/** Whole days from b to a (a - b). */
function diffDays(a, b) {
  const ua = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  const ub = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((ua - ub) / 86400000);
}

const fmt = (d, opts = { day: 'numeric', month: 'short' }) =>
  d.toLocaleDateString('en-IN', opts);

const fmtLong = (d) =>
  d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

function escapeHtml(str = '') {
  return String(str).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

/* ===== store ===== */
// Local storage persistence. All data stays on this device.

const KEY = 'bloom-data-v1';

const defaults = () => ({
  settings: { cycleLength: 28, periodLength: 5, lutealLength: 14 },
  days: {}, // { 'YYYY-MM-DD': { flow, symptoms: [], mood, notes } }
});

let state = load();

function normalise(data) {
  const base = defaults();
  const days = {};
  for (const [k, v] of Object.entries(data?.days || {})) {
    if (isValidKey(k) && v && typeof v === 'object') days[k] = v;
  }
  return { settings: { ...base.settings, ...(data?.settings || {}) }, days };
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    return raw ? normalise(JSON.parse(raw)) : defaults();
  } catch {
    return defaults();
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('Could not save data', e);
  }
}

const getState = () => state;
const getDay = (key) => state.days[key] || null;

function setDay(key, entry) {
  const clean = {
    flow: entry.flow || '',
    symptoms: entry.symptoms || [],
    mood: entry.mood || '',
    notes: (entry.notes || '').trim(),
  };
  const empty = !clean.flow && !clean.symptoms.length && !clean.mood && !clean.notes;
  if (empty) delete state.days[key];
  else state.days[key] = clean;
  save();
}

function setFlow(key, flow) {
  setDay(key, { ...(getDay(key) || {}), flow });
}

function updateSettings(patch) {
  state.settings = { ...state.settings, ...patch };
  save();
}

function exportData() {
  return JSON.stringify({ app: 'bloom', version: 1, exportedAt: new Date().toISOString(), ...state }, null, 2);
}

function importData(json) {
  const data = JSON.parse(json);
  if (!data || typeof data !== 'object' || !data.days) throw new Error('Not a Bloom backup file');
  state = normalise(data);
  save();
}

function resetAll() {
  state = defaults();
  save();
}

/* ===== cycle ===== */
// Cycle maths: groups logged days into periods and predicts what's next.

const isBleeding = (entry) => entry && entry.flow && entry.flow !== 'spotting';
const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;

/** Consecutive bleeding days (allowing a 1-day gap) become one period. */
function getPeriods(days) {
  const keys = Object.keys(days).filter((k) => isBleeding(days[k])).sort();
  const periods = [];
  for (const k of keys) {
    const last = periods[periods.length - 1];
    if (last && diffDays(fromKey(k), fromKey(last.end)) <= 2) {
      last.end = k;
      last.length = diffDays(fromKey(k), fromKey(last.start)) + 1;
    } else {
      periods.push({ start: k, end: k, length: 1 });
    }
  }
  return periods;
}

function getStats(state) {
  const { days, settings } = state;
  const luteal = settings.lutealLength || 14;
  const periods = getPeriods(days);

  const cycles = [];
  for (let i = 1; i < periods.length; i++) {
    const length = diffDays(fromKey(periods[i].start), fromKey(periods[i - 1].start));
    if (length >= 15 && length <= 60) cycles.push({ start: periods[i - 1].start, length });
  }

  const recentCycles = cycles.slice(-6);
  const avgCycle = recentCycles.length ? Math.round(avg(recentCycles.map((c) => c.length))) : settings.cycleLength;
  const recentPeriods = periods.slice(-6);
  const avgPeriod = recentPeriods.length
    ? Math.max(1, Math.round(avg(recentPeriods.map((p) => p.length))))
    : settings.periodLength;

  const lastPeriod = periods[periods.length - 1] || null;
  const stats = { periods, cycles, avgCycle, avgPeriod, lastPeriod, luteal };
  if (!lastPeriod) return stats;

  const t = today();
  const lastStart = fromKey(lastPeriod.start);
  const cycleDay = diffDays(t, lastStart) + 1;
  const nextStart = addDays(lastStart, avgCycle);
  const daysUntil = diffDays(nextStart, t);
  const onPeriod = cycleDay <= Math.max(avgPeriod, lastPeriod.length) && diffDays(t, fromKey(lastPeriod.end)) <= 1;

  // Fertile window: ovulation ~luteal days before the next period.
  let ovulation = addDays(nextStart, -luteal);
  if (diffDays(t, ovulation) > 1) ovulation = addDays(ovulation, avgCycle);
  const fertileStart = addDays(ovulation, -5);
  const fertileEnd = addDays(ovulation, 1);
  const inFertile = diffDays(t, fertileStart) >= 0 && diffDays(fertileEnd, t) >= 0;

  let phase;
  if (onPeriod) phase = 'Period';
  else if (daysUntil < 0) phase = 'Period expected';
  else if (inFertile) phase = 'Fertile window';
  else if (diffDays(fertileStart, t) > 0 && diffDays(nextStart, ovulation) > 0) phase = 'Follicular phase';
  else phase = 'Luteal phase';

  return {
    ...stats, cycleDay, nextStart, daysUntil, onPeriod,
    ovulation, fertileStart, fertileEnd, phase,
  };
}

/** Map of date key -> Set of prediction flags ('predicted' | 'fertile' | 'ovulation'). */
function getPredictions(stats, monthsAhead = 12) {
  const map = new Map();
  if (!stats.lastPeriod) return map;
  const mark = (d, flag) => {
    const k = toKey(d);
    if (!map.has(k)) map.set(k, new Set());
    map.get(k).add(flag);
  };

  const t = today();
  const lastStart = fromKey(stats.lastPeriod.start);
  const count = Math.ceil((monthsAhead * 30) / stats.avgCycle) + 1;

  for (let i = 1; i <= count; i++) {
    const start = addDays(lastStart, stats.avgCycle * i);
    // If late, shift the very next prediction to start today.
    const pStart = i === 1 && diffDays(start, t) < 0 ? t : start;
    for (let d = 0; d < stats.avgPeriod; d++) {
      const day = addDays(pStart, d);
      if (diffDays(day, t) >= 0) mark(day, 'predicted');
    }
    const ov = addDays(start, -stats.luteal);
    for (let d = -5; d <= 1; d++) {
      const day = addDays(ov, d);
      if (diffDays(day, lastStart) > 0) mark(day, d === 0 ? 'ovulation' : 'fertile');
    }
  }
  return map;
}

// Small shared UI helpers.

let toastTimer;
function toast(message) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

let refreshFn = () => {};
const onRefresh = (fn) => { refreshFn = fn; };
/** Re-render the current page without moving focus. */
const refresh = () => refreshFn();

  { value: '', label: 'None' },

function renderWelcome(el, state) {
  const tKey = toKey(today());

      </form>
    </section>
  `;

  el.querySelector('#welcome-form').addEventListener('submit', (e) => {
    e.preventDefault();

    const periodLength = clamp(+el.querySelector('#w-period').value, 1, 10, 5);
    const cycleLength = clamp(+el.querySelector('#w-cycle').value, 20, 45, 28);
    const err = el.querySelector('#welcome-error');
    if (!startVal) { err.textContent = 'Please choose a date.'; el.querySelector('#last-start').focus(); return; }
    const start = fromKey(startVal);
    if (diffDays(start, today()) > 0) { err.textContent = 'The date can’t be in the future.'; return; }

    updateSettings({ periodLength, cycleLength });
    for (let i = 0; i < periodLength; i++) {
      const d = addDays(start, i);
      if (diffDays(d, today()) > 0) break;
      setDay(toKey(d), { ...(getDay(toKey(d)) || {}), flow: 'medium' });
    }
    toast('All set!');
    refresh();
  });
}

const clamp = (n, min, max, fallback) => (Number.isFinite(n) && n > 0 ? Math.min(max, Math.max(min, Math.round(n))) : fallback);

return { title, render };
})();

/* ===== View: calendar ===== */
const CalendarView = (() => {
const title = 'Calendar';
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function render(el, params) {
  const t = today();
  let year = t.getFullYear();
  let month = t.getMonth();
  const m = /^(\d{4})-(\d{2})$/.exec(params[0] || '');
  if (m) { year = +m[1]; month = +m[2] - 1; }

  const state = getState();
  const stats = getStats(state);
  const preds = getPredictions(stats);

  const first = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prev = new Date(year, month - 1, 1);
  const next = new Date(year, month + 1, 1);
  const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;

  const cells = [];
  for (let i = 0; i < first.getDay(); i++) cells.push('<span aria-hidden="true"></span>');

  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(year, month, day);
    const key = toKey(date);
    const entry = state.days[key];
    const flags = preds.get(key) || new Set();
    const isFuture = diffDays(date, t) > 0;
    const cls = ['cal-day'];
    const desc = [];

    if (entry?.flow && entry.flow !== 'spotting') { cls.push('period'); desc.push(`period, ${flowLabel(entry.flow).toLowerCase()} flow`); }
    else if (entry?.flow === 'spotting') { cls.push('spotting'); desc.push('spotting'); }
    else if (flags.has('predicted')) { cls.push('predicted'); desc.push('predicted period'); }
    if (!cls.includes('period')) {
      if (flags.has('ovulation')) { cls.push('fertile', 'ovulation'); desc.push('estimated ovulation'); }
      else if (flags.has('fertile')) { cls.push('fertile'); desc.push('fertile window'); }
    }
    if (entry && (entry.symptoms?.length || entry.mood || entry.notes)) { cls.push('has-log'); desc.push('has notes'); }
    if (diffDays(date, t) === 0) { cls.push('today'); desc.unshift('today'); }
    if (isFuture) cls.push('future');

    const label = [fmt(date, { day: 'numeric', month: 'long' }), ...desc].join(', ');
    cells.push(isFuture
      ? `<span class="${cls.join(' ')}" role="img" aria-label="${label}">${day}</span>`
      : `<a class="${cls.join(' ')}" href="#/log/${key}" aria-label="${label}" data-testid="day-${key}"${diffDays(date, t) === 0 ? ' aria-current="date"' : ''}>${day}</a>`);
  }

  el.innerHTML = `
    <section class="card">
      <div class="cal-head">
        <a class="icon-btn" href="#/calendar/${monthKey(prev)}" aria-label="Previous month" data-testid="cal-prev">‹</a>
        <h1 tabindex="-1" data-testid="cal-title">${first.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</h1>
        <a class="icon-btn" href="#/calendar/${monthKey(next)}" aria-label="Next month" data-testid="cal-next">›</a>
      </div>
      <div class="cal-grid">
        ${DOW.map((d) => `<span class="cal-dow" aria-hidden="true">${d}</span>`).join('')}
        ${cells.join('')}
      </div>
      <ul class="legend" aria-label="Legend">
        <li><span class="swatch period" aria-hidden="true"></span>Period</li>
        <li><span class="swatch predicted" aria-hidden="true"></span>Predicted</li>
        <li><span class="swatch fertile" aria-hidden="true"></span>Fertile</li>
        <li><span class="swatch ovulation" aria-hidden="true"></span>Ovulation</li>
        <li><span class="swatch today" aria-hidden="true"></span>Today</li>
      </ul>
    </section>
    <p class="muted small center">Tap a day to log your period, symptoms or mood.</p>
    ${monthKey(first) !== monthKey(t) ? `<p class="center"><a class="btn btn-secondary" href="#/calendar">Back to this month</a></p>` : ''}
  `;
}

return { title, render };
})();

/* ===== View: log ===== */
const LogView = (() => {
const title = 'Log';

function render(el, params) {
  const t = today();
  const key = isValidKey(params[0] || '') ? params[0] : toKey(t);
  const date = fromKey(key);
  const isFuture = diffDays(date, t) > 0;
  const isToday = diffDays(date, t) === 0;
  const prevKey = toKey(addDays(date, -1));
  const nextKey = toKey(addDays(date, 1));
  const entry = getDay(key) || { flow: '', symptoms: [], mood: '', notes: '' };

  const header = `
    <div class="date-nav">
      <a class="icon-btn" href="#/log/${prevKey}" aria-label="Previous day" data-testid="log-prev">‹</a>
      <h1 tabindex="-1" data-testid="log-date">${isToday ? 'Today' : fmtLong(date)}</h1>
      <a class="icon-btn" href="#/log/${nextKey}" aria-label="Next day" data-testid="log-next"
        ${isToday || isFuture ? 'aria-disabled="true" tabindex="-1"' : ''}>›</a>
    </div>`;

  if (isFuture) {
    el.innerHTML = `${header}
      <section class="card"><p>You can’t log days in the future.</p>
      <a class="btn btn-primary" href="#/log">Go to today</a></section>`;
    return;
  }

  el.innerHTML = `${header}
    ${isToday ? `<p class="muted small center" style="margin-top:-8px">${fmtLong(date)}</p>` : ''}
    <form class="card" id="log-form" novalidate>
      <fieldset>
        <legend>Period flow</legend>
        <div class="pills">
          ${FLOWS.map((f) => pill('radio', 'flow', f.value, f.label, entry.flow === f.value)).join('')}
        </div>
      </fieldset>

      <fieldset>
        <legend>Symptoms</legend>
        <div class="pills">
          ${SYMPTOMS.map((s) => pill('checkbox', 'symptoms', s, s, entry.symptoms?.includes(s))).join('')}
        </div>
      </fieldset>

      <fieldset>
        <legend>Mood</legend>
        <div class="pills">
          ${pill('radio', 'mood', '', 'None', !entry.mood)}
          ${MOODS.map((m) => pill('radio', 'mood', m, m, entry.mood === m)).join('')}
        </div>
      </fieldset>

      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" data-testid="log-notes">${escapeHtml(entry.notes)}</textarea>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn btn-primary" data-testid="log-save">Save</button>
        ${getDay(key) ? `<button type="button" class="btn btn-danger" id="clear-day" data-testid="log-clear">Clear day</button>` : ''}
      </div>
    </form>
  `;

  const form = el.querySelector('#log-form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    setDay(key, {
      flow: fd.get('flow') || '',
      symptoms: fd.getAll('symptoms'),
      mood: fd.get('mood') || '',
      notes: fd.get('notes') || '',
    });
    toast('Saved');
    refresh();
  });

  el.querySelector('#clear-day')?.addEventListener('click', () => {
    setDay(key, {});
    toast('Day cleared');
    refresh();
  });
}

function pill(type, name, value, label, checked) {
  const id = `${name}-${value || 'none'}`.replace(/\s+/g, '-').toLowerCase();
  return `<label class="pill" for="${id}">
    <input type="${type}" id="${id}" name="${name}" value="${escapeHtml(value)}" ${checked ? 'checked' : ''} data-testid="${id}">
    <span>${label}</span>
  </label>`;
}

return { title, render };
})();

    location.hash = '#/today';
  });
}

return { title, render };
})();

/* ===== App / router ===== */
// Hash router + app boot.

const routes = { today: TodayView, calendar: CalendarView, log: LogView, history: HistoryView, settings: SettingsView };
const main = document.getElementById('app');
let firstLoad = true;

function parseHash() {
  const [name, ...params] = location.hash.replace(/^#\/?/, '').split('/');
  return { name: routes[name] ? name : 'today', params };
}

function render({ moveFocus }) {
  const { name, params } = parseHash();
  const view = routes[name];
  main.innerHTML = '';
  view.render(main, params);

  document.title = `${view.title} – Bloom`;
  document.querySelectorAll('.bottom-nav a').forEach((a) => {
    if (a.dataset.route === name) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });

  if (moveFocus && !firstLoad) {
    window.scrollTo(0, 0);
    (main.querySelector('h1') || main).focus({ preventScroll: true });
  }
  firstLoad = false;
}

window.addEventListener('hashchange', () => render({ moveFocus: true }));
onRefresh(() => render({ moveFocus: false }));
render({ moveFocus: false });

})();
</script>
